<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2人聊天室</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-box {
      width: 400px;
      height: 600px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #07c160;
      color: #fff;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.me {
      align-self: flex-end;
      background: #07c160;
      color: #fff;
    }
    .msg.partner {
      align-self: flex-start;
      background: #f1f1f1;
      color: #333;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: #999;
      font-size: 12px;
    }
    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #eee;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }
    #input:focus { border-color: #07c160; }
    #input:disabled { background: #f5f5f5; }
    #send {
      padding: 10px 20px;
      background: #07c160;
      color: #fff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    #send:disabled { background: #ccc; cursor: not-allowed; }
    #send:hover:not(:disabled) { background: #06ad56; }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="header" id="status">正在寻找聊天对象...</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input id="input" type="text" placeholder="输入消息..." disabled autocomplete="off">
      <button id="send" disabled>发送</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setConnected(connected) {
      inputEl.disabled = !connected;
      sendBtn.disabled = !connected;
      if (connected) inputEl.focus();
    }

    socket.on('waiting', () => {
      statusEl.textContent = '正在寻找聊天对象...';
      addMessage('等待对方加入...', 'system');
    });

    socket.on('matched', () => {
      statusEl.textContent = '已连接 - 可以开始聊天了';
      addMessage('对方已加入，开始聊天吧！', 'system');
      setConnected(true);
    });

    socket.on('partner-left', () => {
      statusEl.textContent = '对方已离开';
      addMessage('对方已离开', 'system');
      setConnected(false);
    });

    socket.on('message', (data) => {
      addMessage(data.text, 'partner');
    });

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, 'me');
      socket.emit('message', text);
      inputEl.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
